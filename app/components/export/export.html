<div id="exportDiv">
    <div class="modal-header">
        <h2 class="modal-title">Export</h2>
    </div>
    <div class="modal-body">
        <div class="container-fluid">

            <div class="row">
                <h4>Choose format:</h4>

                <input ng-click="vm.place(0)"  type="radio" value="all" ng-model="vm.exportType">
                <strong>-- Download all three --</strong>
                <br/>
                <input ng-click="vm.place(1)" type="radio" value="csv" ng-model="vm.exportType">
                <strong>CSV</strong> (table of recorded data)
                <br/>
                <input ng-click="vm.place(2)" type="radio" value="txt" ng-model="vm.exportType">
                <strong>TXT</strong> (encrypted data saved as text)
                <br/>
                <input ng-click="vm.place(3)" type="radio" value="png" ng-model="vm.exportType">
                <strong>PNG</strong> (image of graph)
            </div>

          <div class="row">
            <h4>Filename:</h4>
            <div class="input-group">
              <span class="input-group-addon" id="basic-addon3"><span class="disabled glyphicon glyphicon-file"></span></span>
              <input type="text" class="form-control" id="filename" placeholder={{vm.placeholder}} aria-describedby="basic-addon3">
              <span ng-hide="vm.hide" class="input-group-addon" id="basic-addon2">{{vm.ext}}</span>
            </div>
          </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" ng-click="vm.close()">Close</button>
        <button type="button" class="btn btn-primary" ng-click="vm.exportData()">Export</button>
    </div>
</div>
