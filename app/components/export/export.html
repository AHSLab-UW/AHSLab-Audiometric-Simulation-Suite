<div id="exportDiv">
    <div class="modal-header">
        <h2 class="modal-title">Export</h2>
    </div>
    <div class="modal-body">
        <div class="container-fluid">
            <div class="row">
                <h4>Choose format:</h4>
                <input type="radio" value="csv" ng-model="vm.exportType">
                <strong>CSV</strong> (table of recorded data)
                <br/>
                <input type="radio" value="txt" ng-model="vm.exportType">
                <strong>TXT</strong> (encrypted data saved as text)
                <br/>
                <input type="radio" value="png" ng-model="vm.exportType">
                <strong>PNG</strong> (image of graph)
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" ng-click="vm.close()">Close</button>
        <button type="button" class="btn btn-primary" ng-click="vm.exportData()">Export</button>
    </div>
</div>
