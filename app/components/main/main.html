<div class="container-fluid" id="hearingTestView">
    <div class="panel col-sm-12 simulator">
        <control-panel is-auto-testing="vm.isAutoTesting" is-manual-testing="vm.isManualTesting"></control-panel>
        <div class="col-sm-9" id="graphArea">
            <div ng-show="!(vm.isAutoTesting)">
                <figure>
                    <img src="images/audiogram.png" width="634px" height="520px" alt="graph image" />
                    <graph-marks></graph-marks>
                    <canvas id="canvas" style="z-index: 10;position: absolute; top: 0; left: 0;" width="634px" height="520px"></canvas>
                    <canvas id="canvas2" style="z-index: 10;position: absolute; top: 0; left: 0;" width="634px" height="520px"></canvas>
                </figure>
            </div>
            <div ng-show="vm.isAutoTesting">
                <automatic-exercise is-auto-testing="vm.isAutoTesting"></automatic-exercise>
            </div>
        </div>
    </div>
</div>
