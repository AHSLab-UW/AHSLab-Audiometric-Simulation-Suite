<div class="container-fluid" id="hearingTestView">
    <div class="row">
        <div class="panel col-sm-12 simulator">
            <control-panel is-auto-testing="vm.isAutoTesting" is-manual-testing="vm.isManualTesting"></control-panel>
            <div class="col-sm-9">
                <div ng-show="!(vm.isAutoTesting || vm.isManualTesting)">
                    <figure>
                        <img src="components/main/audiogram.png" height="520px" width="634px" alt="graph image" />
                    </figure>
                </div>
                <div ng-show="vm.isAutoTesting">
                    <automatic-exercise is-auto-testing="vm.isAutoTesting"></automatic-exercise>
                </div>
                <div ng-show="vm.isManualTesting">Manual Test</div>
            </div>
        </div>
    </div>
</div>
