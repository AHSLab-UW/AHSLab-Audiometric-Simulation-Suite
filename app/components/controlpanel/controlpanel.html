<div class="col-sm-3 control-panel">

    <div class="row">
        <h4>Control Panel</h4>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <div class="dropdown">
                <button class="btn btn-default btn-sm col-xs-12 dropdown-toggle" type="button"
                        id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true"
                        ng-disabled="vm.isAutoTesting||vm.isManualTesting">
                    Option 1
                    <span class="caret"></span>
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                    <li><a href="#/">Option 1</a></li>
                    <li><a href="#/">Option 2</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setEarSide(0)"
               ng-class="{active: vm.getEarSide() == 0, disabled: vm.isAutoTesting||vm.isManualTesting}">Left</a>
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setEarSide(1)"
               ng-class="{active: vm.getEarSide() == 1, disabled: vm.isAutoTesting||vm.isManualTesting}">Right</a>
        </div>
    </div>

    <div class="row">
        <label for="frequency" class="col-xs-5">Frequency</label>
        <a ng-href="" ng-click="vm.decreaseFrequency()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span>
        </a>
        <p class="col-xs-3" id="frequency">
            {{ vm.getFrequency() }}Hz
        </p>
        <a ng-href="" ng-click="vm.increaseFrequency()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span>
        </a>
    </div>

    <div class="row">
        <label for="stimulus" class="col-xs-5">Stimulus</label>
        <a ng-href="" ng-click="vm.decreaseStimulus()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span>
        </a>
        <p class="col-xs-3" id="stimulus">
            {{ vm.getStimulus() }}dBHL
        </p>
        <a ng-href="" ng-click="vm.increaseStimulus()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span>
        </a>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-primary"
                    ng-click="vm.openCalibration()" ng-disabled="vm.isAutoTesting||vm.isManualTesting">
                Calibration
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-success"
                    ng-click="vm.openAutoTest()" ng-disabled="vm.isAutoTesting||vm.isManualTesting">
                Automatic Hearing Test
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-success"
                    ng-click="vm.openManualTest()" ng-disabled="vm.isAutoTesting||vm.isManualTesting">
                Manual Hearing Test &nbsp;<span class="glyphicon glyphicon-arrow-down"></span>
            </button>
        </div>
    </div>

    <hr style="border: 1px solid #999; margin-top: 5px; margin-bottom: 10px;">

    <div id="manualTest" ng-show="vm.isManualTesting" style="font-size: 75%;">
        <div class="row">
            <div class="col-xs-6"><i><u>Action</u></i></div>
            <div class="col-xs-6"><i><u>HotKey</u></i></div>
        </div>
        <br>
        <div class="row">
            <div class="col-xs-6">
                <p style="color: blue; cursor: pointer;" ng-click="vm.presentTone()">Present Tone</p>
            </div>
            <div class="col-xs-6">
                Space Bar
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p>Adjust Frequency</p>
            </div>
            <div class="col-xs-6">
                Left/Right Arrow Keys
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p>Adjust Stimulus (+/- 5dB)</p>
            </div>
            <div class="col-xs-6">
                Up/Down Arrow Keys
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p style="color: blue; cursor: pointer;" ng-click="vm.recordResult()">Record</p>
            </div>
            <div class="col-xs-6">
                'Enter' Key
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p style="color: blue; cursor: pointer;" ng-click="vm.endManualTest()">Done</p>
            </div>
            <div class="col-xs-6">
                'D' Key
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <button style="pointer-events: none;" class="col-xs-12 btn btn-xs btn-success"
                        ng-show="vm.isPlaying">
                    Tone Playing &nbsp;<span class="glyphicon glyphicon-volume-up"></span>
                </button>
            </div>
        </div>
    </div>

</div>
