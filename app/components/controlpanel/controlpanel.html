<div class="col-sm-3 control-panel">
    <div class="row">
        <h4>Control Panel</h4>
    </div>
    <div class="row">

        <div class="col-xs-12">
            <div class="dropdown">
                <button class="btn btn-default btn-sm col-xs-12 dropdown-toggle" type="button" id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
                    Option 1
                    <span class="caret"></span>
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                    <li><a href="#/">Option 1</a></li>
                    <li><a href="#/">Option 2</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-12">
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-class="{active: vm.getEarSide() == 1}" ng-click="vm.setEarSide(1)">Right</a>
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-class="{active: vm.getEarSide() == 0}" ng-click="vm.setEarSide(0)">Left</a>
        </div>
    </div>
    <div class="row">
            <label for="frequency" class="col-xs-5">Frequency</label>
            <a ng-href="" ng-click="vm.decreaseFrequency()"><span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span></a>
            <p class="col-xs-3" id="frequency">
                {{ vm.getFrequency() }}Hz
            </p>
            <a ng-href="" ng-click="vm.increaseFrequency()"><span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span></a>
    </div>
    <div class="row">
            <label for="stimulus" class="col-xs-5">Stimulus</label>
            <a ng-href="" ng-click="vm.decreaseStimulus()"><span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span></a>
            <p class="col-xs-3" id="stimulus">
                {{ vm.getStimulus() }}dBHL
            </p>
            <a ng-href="" ng-click="vm.increaseStimulus()"><span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span></a>
    </div>
    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-primary" ng-click="vm.openCalibration()">Calibration</button>
        </div>
    </div>
</div>
