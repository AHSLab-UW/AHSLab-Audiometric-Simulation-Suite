<div class="col-sm-3 control-panel">

    <div class="row">
        <h4>Control Panel</h4>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setConduction(0)"
               ng-class="{active: vm.getConduction() == 0, disabled: vm.isAutoTesting||vm.isManualTesting}">AC</a>
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setConduction(1)"
               ng-class="{active: vm.getConduction() == 1, disabled: vm.isAutoTesting||vm.isManualTesting}">BC</a>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setEarSide(0)"
               ng-class="{active: vm.getEarSide() == 0, disabled: vm.isAutoTesting||vm.isManualTesting}">Left</a>
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setEarSide(1)"
               ng-class="{active: vm.getEarSide() == 1, disabled: vm.isAutoTesting||vm.isManualTesting}">Right</a>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setMasking(1)"
               ng-class="{active: vm.getMasking() == 1, disabled: vm.isAutoTesting||vm.isManualTesting}">Masked</a>
            <a ng-href="" class="btn btn-default btn-sm col-xs-6" ng-click="vm.setMasking(0)"
               ng-class="{active: vm.getMasking() == 0, disabled: vm.isAutoTesting||vm.isManualTesting}">Unmasked</a>
        </div>
    </div>
    <br>
    <div class="row">
        <label for="frequency" class="col-xs-5">Frequency</label>
        <a ng-href="" ng-click="vm.decreaseFrequency()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span>
        </a>
        <p class="col-xs-3" id="frequency">
            {{ vm.getFrequency() }}Hz
        </p>
        <a ng-href="" ng-click="vm.increaseFrequency()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span>
        </a>
    </div>

    <div class="row">
        <label for="stimulus" class="col-xs-5">Sig. Lev.</label>
        <a ng-href="" ng-click="vm.decreaseStimulus()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span>
        </a>
        <p class="col-xs-3" id="stimulus">
            {{ vm.getStimulus() }}dBHL
        </p>
        <a ng-href="" ng-click="vm.increaseStimulus()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span>
        </a>
    </div>

    <div class="row">
        <label for="maskerLevel" class="col-xs-5">Masker</label>
        <a ng-href="" ng-click="vm.decreaseMaskerLevel()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-minus-sign col-xs-2" aria-hidden="true"></span>
        </a>
        <p class="col-xs-3" id="stimulus">
            {{ vm.getMaskerLevel() }}dBHL
        </p>
        <a ng-href="" ng-click="vm.increaseMaskerLevel()" ng-class="{linkDisabled: vm.isAutoTesting}">
            <span class="glyphicon glyphicon-plus-sign col-xs-2" aria-hidden="true"></span>
        </a>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-sm btn-success"
                    ng-click="vm.openAutoTest()" ng-hide="vm.isAutoTesting||vm.isManualTesting">
                Automatic
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-sm btn-success"
                    ng-click="vm.openAutoSimulated()" ng-hide="vm.isAutoTesting||vm.isManualTesting">
                Automatic Simulated
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-sm btn-success"
                    ng-click="vm.openManualTest()" ng-hide="vm.isAutoTesting||vm.isManualTesting">
                Manual
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-sm btn-success"
                    ng-click="vm.openManualSimulated()" ng-hide="vm.isAutoTesting||vm.isManualTesting">
                Manual Simulated
            </button>
        </div>
    </div>

    <hr style="border: 1px solid #999; margin-top: 5px; margin-bottom: 10px;">

    <div class="row" ng-hide="vm.isAutoTesting || vm.isManualTesting">
        <div class="col-xs-12">
            <button type="button" class="col-xs-12 col-sm-12 btn btn-xs btn-primary"
                    ng-click="vm.openCalibration()">
                Calibration
            </button>
        </div>
    </div>

    <div class="row" ng-show="vm.isManualTesting && vm.isSimulated">
        <div class="col-xs-12">
            <button style="pointer-events: none;" class="col-xs-12 btn btn-xs btn-info">
                Simulated Listener
            </button>
        </div>
    </div>

    <div class="row" ng-hide="vm.isAutoTesting || vm.isManualTesting">
        <div class="col-xs-3"><button class="btn btn-xs btn-default" ng-click="vm.openImport()">Import</button></div>
        <div class="col-xs-3"><button class="btn btn-xs btn-default" ng-click="vm.openExport()">Export</button></div>
        <div class="col-xs-3"><button class="btn btn-xs btn-warning" ng-click="vm.clearData()">Clear Graph</button></div>
    </div>

    <div id="manualTest" ng-show="vm.isManualTesting" style="font-size: 75%;">
        <div class="row">
            <div class="col-xs-6"><i><u>Action</u></i></div>
            <div class="col-xs-6"><i><u>HotKey</u></i></div>
        </div>
        <br>
        <div class="row">
            <div class="col-xs-6">
                <p style="color: blue; cursor: pointer;" ng-click="vm.presentTone()">Present Tone</p>
            </div>
            <div class="col-xs-6">
                Space Bar
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p>Adjust Frequency</p>
            </div>
            <div class="col-xs-6">
                Left/Right Arrow Keys
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p>Adjust Stimulus (+/- 5dB)</p>
            </div>
            <div class="col-xs-6">
                Up/Down Arrow Keys
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p style="color: blue; cursor: pointer;" ng-click="vm.recordResult()">Record</p>
            </div>
            <div class="col-xs-6">
                'Enter' Key
            </div>
        </div>
        <div class="row">
            <div class="col-xs-6">
                <p style="color: blue; cursor: pointer;" ng-click="vm.endManualTest()">Done</p>
            </div>
            <div class="col-xs-6">
                'D' Key
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <button style="pointer-events: none;" class="col-xs-12 btn btn-xs btn-success"
                        ng-show="vm.isPlaying && !vm.isSimulated">
                    Tone Playing &nbsp;<span class="glyphicon glyphicon-volume-up"></span>
                </button>
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <button style="pointer-events: none;" class="col-xs-12 btn btn-xs btn-success"
                        ng-show="vm.isPlaying && vm.isSimulated && vm.simulatedResponse">
                    Yes
                </button>
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <button style="pointer-events: none;" class="col-xs-12 btn btn-xs btn-danger"
                        ng-show="vm.isPlaying && vm.isSimulated && !vm.simulatedResponse">
                    No
                </button>
            </div>
        </div>
    </div>

</div>
